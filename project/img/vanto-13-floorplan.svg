<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">
  <rect width="640" height="280" fill="#ffffff"/>
  <!-- outer shell of the van, seen from above; the front (cab) is on the left -->
  <path d="M40 60 Q40 30 80 30 L600 30 L600 250 L80 250 Q40 250 40 220 Z" fill="#f4f4f4" stroke="#2f3a45" stroke-width="4"/>
  <!-- cab with two swivel seats -->
  <rect x="60" y="50" width="110" height="180" fill="#e3ecf5" stroke="#2f3a45" stroke-width="2"/>
  <rect x="85" y="65" width="60" height="60" rx="8" fill="#ffffff" stroke="#2f3a45" stroke-width="2"/>
  <rect x="85" y="155" width="60" height="60" rx="8" fill="#ffffff" stroke="#2f3a45" stroke-width="2"/>
  <text x="115" y="145">Cab</text>
  <!-- table -->
  <rect x="180" y="50" width="80" height="80" fill="#fdf1dc" stroke="#2f3a45" stroke-width="2"/>
  <text x="220" y="95">Table</text>
  <!-- kitchen -->
  <rect x="270" y="50" width="130" height="60" fill="#fdf1dc" stroke="#2f3a45" stroke-width="2"/>
  <text x="335" y="85">Kitchen</text>
  <!-- toilet and shower -->
  <rect x="270" y="170" width="130" height="60" fill="#e3ecf5" stroke="#2f3a45" stroke-width="2"/>
  <text x="335" y="205">Toilet + shower</text>
  <!-- sliding door gap -->
  <rect x="180" y="242" width="80" height="16" fill="#ffffff"/>
  <text x="220" y="272" font-size="13">Sliding door</text>
  <!-- bed across the back -->
  <rect x="410" y="50" width="170" height="180" fill="#e9f2e1" stroke="#2f3a45" stroke-width="2"/>
  <text x="495" y="135">Double bed</text>
  <text x="495" y="155" font-size="13">140 × 195 cm</text>
</svg>
